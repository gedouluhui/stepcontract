[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stepcontract"
version = "0.1.1"
description = "Explicit training intent, parameter ownership and step-event contracts for PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "gedouluhui"}]
dependencies = ["torch>=2.2"]

[project.scripts]
stepcontract = "stepcontract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
